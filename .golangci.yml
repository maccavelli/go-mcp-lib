# Pinned golangci-lint 2.15.0 configuration. Staticcheck is enabled with
# SA1019 and no symbol, file, test, or generated-code exclusion. A finding
# is a composition defect, never a policy allowance; there is no exclude
# list, no nolint directive, and no per-file relaxation anywhere in this
# repository.
version: "2"

linters:
  default: standard
  # Standalone full go vet owns these analyzers in both unit and pre-add.
  # Test execution consumes that result with -vet=off. Plants prove detection.
  disable:
    - govet
  settings:
    staticcheck:
      checks:
        - all
  exclusions:
    # Deliberately empty: no path, symbol, linter, or source-based
    # exclusion exists. This block exists only to document that fact.
    paths: null
    rules: null
    generated: disable
# Standalone pinned Revive owns documentation/naming for all sources. The pinned
# golangci Revive adapter internally skips generated files; do not duplicate it.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
